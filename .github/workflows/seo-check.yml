name: SEO Guardrail Check

on:
  push:
    branches: [main]
    paths:
      - '**/index.html'
  pull_request:
    paths:
      - '**/index.html'

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine changed index.html files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            FILES=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }} HEAD -- '**/index.html')
          else
            FILES=$(git diff --name-only --diff-filter=ACMR ${{ github.event.before }} ${{ github.sha }} -- '**/index.html')
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Run SEO checks on changed pages
        if: steps.changed.outputs.files != ''
        run: node .github/scripts/check-seo.js ${{ steps.changed.outputs.files }}
